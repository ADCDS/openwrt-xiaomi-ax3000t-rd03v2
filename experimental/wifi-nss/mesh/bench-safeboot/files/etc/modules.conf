# examples:
# options mod1 option=val
# blacklist mod2

# Bench-only safe boot (issue #21 mesh experiment): hold back the Wi-Fi half,
# i.e. the new mesh code and everything that pulls it in. The NSS core, ECM
# and PPPoE still load exactly as in v1.10, so the proven wired path comes up.
# /usr/sbin/wifi-load loads the Wi-Fi half by hand;
# /etc/init.d/wifi-oneshot does it for one armed boot.
#
# Every module that has its own /etc/modules.d entry must be listed, not just
# the one at the bottom of the chain. ubox kmodloader honours a blacklist only
# for a module's own top-level entry: when it autoloads a module, it marks
# every dependency that isn't LOADED as PROBE, overwriting BLACKLISTED
# (load_moddeps()). Blacklisting only the mesh manager therefore did nothing
# on the bench, because ath11k pulled it in. That was verified on 2026-09-26.
#
# Names MUST be the .ko file names, exactly. The blacklist is a plain strcmp
# kvlist keyed by the .ko basename (get_module_name() does not map '_' to
# '-'), so a different spelling never matches and the module autoloads anyway.
blacklist ath11k_ahb
blacklist ath11k
blacklist qca-nss-wifi-meshmgr
