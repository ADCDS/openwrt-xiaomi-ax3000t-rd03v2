# rd03v2 v2: cap the per-CPU free page lists.
# Linux sizes each CPU's list from the zone's low watermark (since 5.14; auto-tuned since 6.7).
# With OpenWrt's min_free_kbytes=16384 that is 2560 pages = 10 MiB per CPU on this 2-core,
# 256 MB board. Pages parked there are free but count neither in MemFree nor in MemAvailable,
# and kswapd evicts page cache to keep MemFree above the high watermark while they sit there.
# v2 (6.18, no skb recycler) parked 6-18 MB at idle; v1.14-nss (6.12) ~1 MB.
# 100 caps each list at managed_pages / 100 / nr_cpus = 218 pages (~0.85 MiB) and turns off
# the auto-tuning. 0 restores the kernel default.
vm.percpu_pagelist_high_fraction = 100
