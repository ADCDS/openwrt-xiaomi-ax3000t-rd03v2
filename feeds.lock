# Package feed revisions that build.sh pins every feed to: one line per feed
# in OpenWrt's feeds.conf.default and nss/feeds.conf.append, "<name> <commit>".
#
# OpenWrt itself is pinned in build.sh (25ee126), but its feeds follow branch
# heads, so two builds of one commit could pull different packages. On
# 2026-10-01 the heads also grew Kconfig dependency cycles (qt5, gstreamer,
# sdl, ...), which the NSS Wi-Fi build refuses. These are the revisions v1.11
# was built with. For luci, that is the one its -nss image used; its plain
# image was a few commits behind.
#
# nss_packages has no line: build.sh pins it for NSS Wi-Fi builds, and plain
# NSS builds follow its NSS-12.5-K6.x branch. Bump a revision deliberately,
# and check that both flavours still build.
