# The kuncy7/openwrt-nss-edma release that v2/build.sh builds on. Sourced as shell.
# His CI keeps only three releases and rebases his branches, so the commits a release of ours
# builds on live in our forks, tagged rd03v2/<release>: URL (his tree) and NSS_URL (his nss
# feed). build.sh builds from the local mirrors (MIRROR, and NSS_MIRROR in build.sh) and fills
# them from the forks when a pinned commit is missing. UPSTREAM_URL and UPSTREAM_NSS_URL are his
# repositories, which bump-upstream.sh takes new releases from.
URL=https://github.com/ADCDS/openwrt.git
NSS_URL=https://github.com/ADCDS/nss-packages.git
UPSTREAM_URL=https://github.com/kuncy7/openwrt-nss-edma.git
UPSTREAM_NSS_URL=https://github.com/kuncy7/nss-packages.git
MIRROR=${V2_UPSTREAM_MIRROR:-${RD03V2_WS:-$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)}/mirrors/openwrt-nss-edma.git}
RELEASE=ipq50xx-2026.10.09
COMMIT=2c3a4b347c2ba6ea0e2d153b5c59dc21c1e1cf89
# Where v2/feeds.lock's commits come from: FEEDS_FROM names the feeds buildinfo his CI attached
# to the release (the exact commits it built our board group with); without one, FEEDS_FROZEN_AT
# freezes each feed at that time (v2/tools/freeze-feeds.sh).
FEEDS_FROM=
FEEDS_FROZEN_AT=2026-10-09T19:52:00Z
